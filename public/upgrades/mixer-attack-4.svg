<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18241b"/>
      <stop offset="60%" stop-color="#121b14"/>
      <stop offset="100%" stop-color="#0a100c"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffa394"/>
      <stop offset="40%" stop-color="#ed654e"/>
      <stop offset="100%" stop-color="#421410"/>
    </linearGradient>
    <linearGradient id="vehGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7ba84"/>
      <stop offset="50%" stop-color="#f29a51"/>
      <stop offset="100%" stop-color="#472710"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cfdade"/>
      <stop offset="40%" stop-color="#8ba0ab"/>
      <stop offset="100%" stop-color="#495d67"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="20" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8573" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8573" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" stroke="url(#pathGrad)" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="9" stroke="#ed654e" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Blueprint grid dots and subtle reticle -->
  <circle cx="10" cy="10" r="0.8" fill="#ed654e" fill-opacity="0.35"/>
  <circle cx="54" cy="10" r="0.8" fill="#ed654e" fill-opacity="0.35"/>
  <circle cx="10" cy="54" r="0.8" fill="#ed654e" fill-opacity="0.35"/>
  <circle cx="54" cy="54" r="0.8" fill="#ed654e" fill-opacity="0.35"/>
  <circle cx="32" cy="33" r="23" stroke="#ed654e" stroke-opacity="0.08" stroke-dasharray="2 3"/>
  <circle cx="32" cy="33" r="14" fill="url(#glowGrad)"/>

  <!-- Technical Corner Brackets -->
  <path d="M 6 12 L 6 6 L 12 6" stroke="#ed654e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 6 52 L 6 58 L 12 58" stroke="#ed654e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 58 52 L 58 58 L 52 58" stroke="#ed654e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Tier Badge -->
  <g transform="translate(42, 4)">
    <rect width="18" height="11" rx="3.5" fill="#0c150e" stroke="#ed654e" stroke-width="1"/>
    <text x="9" y="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" fill="#ff8573" letter-spacing="0.4">T4</text>
  </g>

  <!-- Artwork Centerpiece -->
  <g class="artwork-centerpiece">
    <!-- T4: Dual Pneumatic Discharge Pump (Double damage) -->
    <!-- Heavy pump housing -->
    <rect x="14" y="22" width="22" height="22" rx="3" fill="url(#vehGrad)" stroke="#ffffff" stroke-width="1"/>
    <rect x="32" y="27" width="16" height="12" rx="2" fill="url(#metalGrad)"/>
    <!-- Intense dual slurry blast jets -->
    <line x1="46" y1="30" x2="58" y2="24" stroke="#ed654e" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="46" y1="36" x2="58" y2="42" stroke="#ed654e" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>