<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18241b"/>
      <stop offset="60%" stop-color="#121b14"/>
      <stop offset="100%" stop-color="#0a100c"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4ebd4"/>
      <stop offset="40%" stop-color="#76b995"/>
      <stop offset="100%" stop-color="#142c1e"/>
    </linearGradient>
    <linearGradient id="vehGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2786d"/>
      <stop offset="50%" stop-color="#e84332"/>
      <stop offset="100%" stop-color="#4a110b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cfdade"/>
      <stop offset="40%" stop-color="#8ba0ab"/>
      <stop offset="100%" stop-color="#495d67"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="20" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0d9b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a0d9b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" stroke="url(#pathGrad)" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="9" stroke="#76b995" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Blueprint grid dots and subtle reticle -->
  <circle cx="10" cy="10" r="0.8" fill="#76b995" fill-opacity="0.35"/>
  <circle cx="54" cy="10" r="0.8" fill="#76b995" fill-opacity="0.35"/>
  <circle cx="10" cy="54" r="0.8" fill="#76b995" fill-opacity="0.35"/>
  <circle cx="54" cy="54" r="0.8" fill="#76b995" fill-opacity="0.35"/>
  <circle cx="32" cy="33" r="23" stroke="#76b995" stroke-opacity="0.08" stroke-dasharray="2 3"/>
  <circle cx="32" cy="33" r="14" fill="url(#glowGrad)"/>

  <!-- Technical Corner Brackets -->
  <path d="M 6 12 L 6 6 L 12 6" stroke="#76b995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 6 52 L 6 58 L 12 58" stroke="#76b995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 58 52 L 58 58 L 52 58" stroke="#76b995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Tier Badge -->
  <g transform="translate(42, 4)">
    <rect width="18" height="11" rx="3.5" fill="#0c150e" stroke="#76b995" stroke-width="1"/>
    <text x="9" y="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" fill="#a0d9b8" letter-spacing="0.4">T5</text>
  </g>

  <!-- Artwork Centerpiece -->
  <g class="artwork-centerpiece">
    <!-- T5: Continuous Caterpillar Tracks (Full grip + 20% speed) -->
    <!-- Heavy track loop -->
    <rect x="10" y="24" width="44" height="20" rx="10" fill="#141e17" stroke="#76b995" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Drive sprockets & road wheels -->
    <circle cx="18" cy="34" r="6" fill="url(#vehGrad)" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="32" cy="34" r="5" fill="url(#metalGrad)"/>
    <circle cx="46" cy="34" r="6" fill="url(#vehGrad)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Deep track grousers -->
    <line x1="12" y1="22" x2="16" y2="22" stroke="#76b995" stroke-width="2"/>
    <line x1="24" y1="22" x2="28" y2="22" stroke="#76b995" stroke-width="2"/>
    <line x1="36" y1="22" x2="40" y2="22" stroke="#76b995" stroke-width="2"/>
    <line x1="48" y1="22" x2="52" y2="22" stroke="#76b995" stroke-width="2"/>
    <line x1="12" y1="46" x2="16" y2="46" stroke="#76b995" stroke-width="2"/>
    <line x1="24" y1="46" x2="28" y2="46" stroke="#76b995" stroke-width="2"/>
    <line x1="36" y1="46" x2="40" y2="46" stroke="#76b995" stroke-width="2"/>
    <line x1="48" y1="46" x2="52" y2="46" stroke="#76b995" stroke-width="2"/>
  </g>
</svg>